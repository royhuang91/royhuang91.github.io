<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title" font-family="sans-serif" font-weight="600">
  <title id="title">拉窗帘练习 9 的已知条件图</title>
  <rect width="560" height="360" fill="#17573a"/>
  <polygon points="80,60 480,60 480,300 80,300" fill="#83dce0" fill-opacity="0.12" stroke="#83dce0" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="200,60 230,60 330,300 300,300" fill="#f4f8f4" fill-opacity="0.75" stroke="#f4f8f4" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="80,60 480,60 480,300 80,300" fill="none" fill-opacity="0.72" stroke="#f4f8f4" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="150" y="40" fill="#ffd23e" font-size="30">截段 1.2 m</text>
  <text x="220" y="340" fill="#ffd23e" font-size="32">16 m</text>
  <text x="550" y="250" fill="#83dce0" font-size="32" text-anchor="end">10 m</text>
</svg>
