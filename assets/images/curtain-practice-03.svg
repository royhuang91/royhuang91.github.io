  <rect width="560" height="360" fill="#17573a"/>
  <polygon points="250,190 130,280 370,280" fill="#f59145" fill-opacity="0.72" stroke="#f59145" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="310,130 130,280 370,280" fill="#83dce0" fill-opacity="0.3" stroke="#83dce0" stroke-width="2.5" stroke-linejoin="round"/>
