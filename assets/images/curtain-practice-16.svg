<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title" font-family="sans-serif" font-weight="600">
  <title id="title">拉窗帘练习 12 的已知条件图</title>
  <rect width="560" height="360" fill="#17573a"/>
  <polygon points="100,280 400,280 460,80 160,80" fill="none" fill-opacity="0.72" stroke="#f4f8f4" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="300,80 100,280 200,280" fill="#f59145" fill-opacity="0.72" stroke="#f59145" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="300,80 200,280 400,280" fill="#83dce0" fill-opacity="0.72" stroke="#83dce0" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="75" y="313" fill="#f4f8f4" font-size="32">A</text>
  <text x="404" y="313" fill="#f4f8f4" font-size="32" text-anchor="end">B</text>
  <text x="464" y="75" fill="#f4f8f4" font-size="32" text-anchor="end">C</text>
  <text x="134" y="75" fill="#f4f8f4" font-size="32">D</text>
  <text x="302" y="64" fill="#f4f8f4" font-size="32">E</text>
  <text x="188" y="313" fill="#f4f8f4" font-size="32">M</text>
  <text x="194" y="340" fill="#ffd23e" font-size="32">AB = 12 cm</text>
  <text x="85" y="260" fill="#ffd23e" font-size="30">AM = 4 cm</text>
  <text x="174" y="218" fill="#ffd23e" font-size="30">16 cm²</text>
</svg>
