<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title" font-family="sans-serif" font-weight="600">
  <title id="title">拉窗帘练习 1 的已知条件图</title>
  <rect width="560" height="360" fill="#17573a"/>
  <polygon points="290,80 100,280 460,280" fill="#f59145" fill-opacity="0.72" stroke="#f59145" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="100,80 460,80 460,280 100,280" fill="none" fill-opacity="0.72" stroke="#f4f8f4" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="290" y1="80" x2="290" y2="280" stroke="#83dce0" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="75" y="310" fill="#f4f8f4" font-size="32">A</text>
  <text x="467" y="310" fill="#f4f8f4" font-size="32" text-anchor="end">B</text>
  <text x="468" y="75" fill="#f4f8f4" font-size="32" text-anchor="end">C</text>
  <text x="74" y="75" fill="#f4f8f4" font-size="32">D</text>
  <text x="302" y="66" fill="#ffd23e" font-size="32">P</text>
  <text x="215" y="340" fill="#ffd23e" font-size="32">AB = 10 cm</text>
  <text x="465" y="195" fill="#83dce0" font-size="32" text-anchor="end">6 cm</text>
</svg>
