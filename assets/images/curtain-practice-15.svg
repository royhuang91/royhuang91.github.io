<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title" font-family="sans-serif" font-weight="600">
  <title id="title">拉窗帘练习 15 的已知条件图</title>
  <rect width="560" height="360" fill="#17573a"/>
  <line x1="35" y1="280" x2="100" y2="280" stroke="#f4f8f4" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="60" y1="90" x2="60" y2="280" stroke="#83dce0" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="60,90 100,280 220,280" fill="#f59145" fill-opacity="0.72" stroke="#f59145" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="60,90 220,280 460,280" fill="#83dce0" fill-opacity="0.72" stroke="#83dce0" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="45" y="70" fill="#f4f8f4" font-size="32">P</text>
  <text x="75" y="312" fill="#f4f8f4" font-size="32">A</text>
  <text x="210" y="312" fill="#f4f8f4" font-size="32">M</text>
  <text x="466" y="312" fill="#f4f8f4" font-size="32" text-anchor="end">B</text>
  <text x="175" y="338" fill="#ffd23e" font-size="32">AB = 18 cm</text>
  <text x="93" y="257" fill="#ffd23e" font-size="30">AM = 6 cm</text>
  <text x="76" y="160" fill="#83dce0" font-size="32">高 8 cm</text>
</svg>
