<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340"><title>蝴蝶结构：为什么不是只乘三？：转化后的关键图</title><rect width="480" height="340" fill="#17573a"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><polygon points="160,100 280,100 220,130" fill="#f59145" fill-opacity="0.48" stroke="#f59145" stroke-width="2.5" stroke-linejoin="round" opacity="1"></polygon><polygon points="40,220 400,220 220,130" fill="#83dce0" fill-opacity="0.48" stroke="#83dce0" stroke-width="2.5" stroke-linejoin="round" opacity="1"></polygon><polygon points="160,100 280,100 400,220 40,220" fill="none" fill-opacity="1" stroke="#f4f8f4" stroke-width="2.5" stroke-linejoin="round" opacity="1"></polygon><line x1="160" y1="100" x2="400" y2="220" stroke="#f4f8f4" stroke-width="2.5" opacity="1"></line><line x1="280" y1="100" x2="40" y2="220" stroke="#f4f8f4" stroke-width="2.5" opacity="1"></line><polygon points="280,100 400,220 220,130" fill="#ffd23e" fill-opacity="0.48" stroke="#ffd23e" stroke-width="2.5" stroke-linejoin="round" opacity="1"></polygon><polygon points="160,100 40,220 220,130" fill="#ffd23e" fill-opacity="0.48" stroke="#ffd23e" stroke-width="2.5" stroke-linejoin="round" opacity="1"></polygon><text x="160" y="88" fill="#f4f8f4" font-size="26" text-anchor="middle" opacity="1">A</text><text x="280" y="88" fill="#f4f8f4" font-size="26" text-anchor="middle" opacity="1">B</text><text x="420" y="242" fill="#f4f8f4" font-size="26" text-anchor="middle" opacity="1">C</text><text x="25" y="242" fill="#f4f8f4" font-size="26" text-anchor="middle" opacity="1">D</text><text x="220" y="163" fill="#f4f8f4" font-size="26" text-anchor="middle" opacity="1">O</text><text x="220" y="60" fill="#ffd23e" font-size="26" text-anchor="middle" opacity="1">AB = 4 cm</text><text x="220" y="285" fill="#ffd23e" font-size="26" text-anchor="middle" opacity="1">DC = 12 cm</text></g></svg>
